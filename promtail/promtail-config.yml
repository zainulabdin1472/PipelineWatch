server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: pipeline
    static_configs:
      - targets:
          - localhost
        labels:
          job: demo-pipeline
          container: demo-pipeline
          pipeline: demo
          __path__: /var/log/pipeline/*.log
    pipeline_stages:
      - regex:
          expression: '^\S+\s+\S+\s+(?P<level>INFO|WARNING|ERROR)\s+'
      - labels:
          level:
