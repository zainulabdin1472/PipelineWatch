name: pipelinewatch

services:
  demo-pipeline:
    build: ./demo-pipeline
    container_name: demo-pipeline
    environment:
      PIPELINE_NAME: demo
      LOG_PATH: /var/log/pipeline/demo.log
      DEMO_FAIL_RATE: ${DEMO_FAIL_RATE:-0.25}
      DEMO_STALE_HOURS: ${DEMO_STALE_HOURS:-0}
      DEMO_INTERVAL_SECONDS: ${DEMO_INTERVAL_SECONDS:-15}
    volumes:
      - pipeline-logs:/var/log/pipeline
    ports:
      - "8000:8000"
    networks:
      - pipelinewatch
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v2.55.1
    container_name: prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
      - --web.enable-lifecycle
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/rules:/etc/prometheus/rules:ro
      - prometheus-data:/prometheus
    ports:
      - "9090:9090"
    depends_on:
      - demo-pipeline
      - alertmanager
    networks:
      - pipelinewatch
    restart: unless-stopped

  alertmanager-init:
    image: python:3.12-alpine
    container_name: alertmanager-init
    environment:
      ALERT_WEBHOOK_URL: ${ALERT_WEBHOOK_URL:-}
      ALERT_RECEIVER: ${ALERT_RECEIVER:-slack}
      TEMPLATE_PATH: /template/alertmanager.yml.template
      OUTPUT_PATH: /out/alertmanager.yml
    volumes:
      - ./alertmanager/alertmanager.yml.template:/template/alertmanager.yml.template:ro
      - ./alertmanager/render_config.py:/render_config.py:ro
      - ./alertmanager/entrypoint.sh:/entrypoint.sh:ro
      - alertmanager-config:/out
    entrypoint: ["sh", "/entrypoint.sh"]
    networks:
      - pipelinewatch
    restart: "no"

  alertmanager:
    image: prom/alertmanager:v0.28.1
    container_name: alertmanager
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
    volumes:
      - alertmanager-config:/etc/alertmanager:ro
      - alertmanager-data:/alertmanager
    ports:
      - "9093:9093"
    depends_on:
      alertmanager-init:
        condition: service_completed_successfully
    networks:
      - pipelinewatch
    restart: unless-stopped

  discord-bridge:
    build: ./bridge
    container_name: discord-bridge
    profiles: ["discord"]
    environment:
      DISCORD_WEBHOOK_URL: ${ALERT_WEBHOOK_URL:-}
    ports:
      - "8088:8080"
    networks:
      - pipelinewatch
    restart: unless-stopped

  loki:
    image: grafana/loki:3.3.2
    container_name: loki
    user: "0:0"
    command: ["-config.file=/etc/loki/loki-config.yml"]
    volumes:
      - ./loki/loki-config.yml:/etc/loki/loki-config.yml:ro
      - loki-data:/loki
    ports:
      - "3100:3100"
    networks:
      - pipelinewatch
    restart: unless-stopped

  promtail:
    image: grafana/promtail:3.3.2
    container_name: promtail
    user: "0:0"
    command: ["-config.file=/etc/promtail/promtail-config.yml"]
    volumes:
      - ./promtail/promtail-config.yml:/etc/promtail/promtail-config.yml:ro
      - pipeline-logs:/var/log/pipeline:ro
    depends_on:
      - loki
      - demo-pipeline
    networks:
      - pipelinewatch
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.4.0
    container_name: grafana
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /etc/grafana/provisioning/dashboards/json/pipeline-health.json
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
      - loki
    networks:
      - pipelinewatch
    restart: unless-stopped

volumes:
  prometheus-data:
  alertmanager-config:
  alertmanager-data:
  loki-data:
  grafana-data:
  pipeline-logs:

networks:
  pipelinewatch:
    name: pipelinewatch
