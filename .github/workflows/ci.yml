name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate docker compose
        run: |
          docker compose config > /dev/null
          docker compose --profile discord config > /dev/null

      - name: Lint Prometheus config and rules
        run: |
          docker run --rm --entrypoint promtool \
            -v "$PWD/prometheus:/etc/prometheus:ro" \
            prom/prometheus:v2.55.1 \
            check config /etc/prometheus/prometheus.yml

      - name: Check dashboard JSON
        run: python3 scripts/check_dashboards.py

      - name: Compile Python
        run: |
          python3 -m py_compile demo-pipeline/app.py \
            exporter-example/metrics_example.py \
            alertmanager/render_config.py \
            bridge/discord_bridge.py \
            scripts/check_dashboards.py
